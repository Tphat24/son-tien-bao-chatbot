<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sơn Tiến Bảo · Trang quản trị</title>
<style>
:root{color-scheme:light;--bg:#f3f6f4;--card:#fff;--ink:#173d30;--muted:#68766f;--brand:#14533d;--brand2:#1d7a56;--line:#e2e9e5;--danger:#c0392b;--warn:#b9770e}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);margin:0;color:var(--ink)}
button{cursor:pointer;font-family:inherit}
input,select,textarea,button{padding:10px;border-radius:8px;border:1px solid #ccd5d0;font-size:14px;font-family:inherit}
textarea{width:100%;resize:vertical}
.hidden{display:none!important}
.btn{background:var(--brand);color:#fff;border:none}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--danger)}

/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:#fff;border-radius:16px;padding:32px;max-width:380px;width:100%;box-shadow:0 10px 40px #0000001a}
#login h1{margin:0 0 4px;font-size:22px}
#login p{margin:0 0 20px;color:var(--muted);font-size:14px}
#login label{display:block;font-size:13px;margin:12px 0 4px;font-weight:600}
#login input{width:100%}
#login button{width:100%;margin-top:20px;padding:12px}
.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

/* Shell */
#app{display:flex;min-height:100vh}
.side{background:var(--brand);color:#fff;width:220px;flex-shrink:0;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{font-size:17px;padding:0 20px;margin:0 0 4px}
.side .who{font-size:12px;color:#bfe3d3;padding:0 20px 16px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
.side a{display:block;padding:11px 20px;color:#dff0e8;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.side a:hover{background:#ffffff14}
.side a.active{background:#ffffff1f;border-left-color:#8fe3bd;color:#fff;font-weight:600}
.side .out{margin:16px 20px;width:calc(100% - 40px)}
.main{flex:1;padding:24px;max-width:1200px}
.main h1{margin:0 0 18px;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 16px #0000000a}
.card .lbl{color:var(--muted);font-size:13px}
.card .num{font-size:30px;font-weight:750;margin-top:4px}
.panel{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 4px 16px #0000000a;margin-bottom:18px}
.panel h3{margin:0 0 14px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:#e7f4ed;font-size:12px;color:var(--brand)}
.badge.gray{background:#eceff0;color:#5a6b64}.badge.warn{background:#fdf0d9;color:var(--warn)}.badge.hot{background:#fbe3df;color:var(--danger)}
.tblwrap{overflow:auto}
.muted{color:var(--muted)}
.right{margin-left:auto}
dialog{border:none;border-radius:14px;padding:0;max-width:640px;width:92%;box-shadow:0 20px 60px #00000030}
dialog::backdrop{background:#0006}
.dlg-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-h h3{margin:0}
.dlg-b{padding:22px;max-height:70vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px #0003;opacity:0;transform:translateY(10px);transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--danger)}
@media(max-width:820px){.cards{grid-template-columns:1fr 1fr}.side{position:fixed;z-index:50;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.menu-btn{display:inline-block!important}.grid2{grid-template-columns:1fr}}
.menu-btn{display:none;background:var(--brand);color:#fff;border:none;padding:8px 12px;border-radius:8px;margin-bottom:14px}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="box">
    <h1>Sơn Tiến Bảo</h1>
    <p>Trang quản trị chatbot</p>
    <label>Email</label>
    <input id="li-email" type="email" placeholder="admin@sontienbao.com" autocomplete="username">
    <label>Mật khẩu</label>
    <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="li-btn">Đăng nhập</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <nav class="side" id="side">
    <h2>Sơn Tiến Bảo</h2>
    <div class="who" id="who">–</div>
    <a data-view="dashboard" class="active">Tổng quan</a>
    <a data-view="leads">Khách hàng</a>
    <a data-view="products">Sản phẩm</a>
    <a data-view="quotations">Báo giá</a>
    <a data-view="colors">Bảng màu</a>
    <a data-view="settings" data-perm="settings">Cấu hình</a>
    <a data-view="staff" data-perm="staff">Nhân viên</a>
    <button class="btn ghost out" id="logout">Đăng xuất</button>
  </nav>

  <main class="main">
    <button class="menu-btn" id="menuBtn">☰ Menu</button>
    <div id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Sơn Tiến Bảo — Admin SPA (single file, no build step)
   Gọi API backend đã xây. Token JWT lưu trong bộ nhớ (biến JS).
   ============================================================ */
const State = { token:null, staff:null, view:'dashboard' };

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,isErr){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isErr?' err':'');setTimeout(()=>t.className='toast',2600)}
function fmtMoney(n){if(n==null||n==='')return '–';return Number(n).toLocaleString('vi-VN')+' đ'}
function fmtDate(s){if(!s)return '–';const d=new Date(s);return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(State.token) headers['Authorization']='Bearer '+State.token;
  const res = await fetch('/api'+path, Object.assign({}, opts, {headers}));
  if(res.status===401){ logout(); throw new Error('Phiên đăng nhập hết hạn'); }
  const text = await res.text();
  let data; try{ data = text?JSON.parse(text):{}; }catch{ data = {raw:text}; }
  if(!res.ok) throw new Error(data.error||('Lỗi '+res.status));
  return data;
}

/* ---------------- Auth ---------------- */
async function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const errEl=document.getElementById('li-err');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='Vui lòng nhập email và mật khẩu.';return}
  try{
    const r = await api('/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
    State.token=r.token; State.staff=r.staff;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('who').textContent=(r.staff.fullName || r.staff.email)+' · '+roleLabel(r.staff.role);
    applyPerms();
    go('dashboard');
  }catch(e){ errEl.textContent = e.message==='invalid_credentials'?'Email hoặc mật khẩu không đúng.':(e.message==='account_locked'?'Tài khoản tạm khóa do đăng nhập sai nhiều lần.':e.message); }
}
function logout(){ State.token=null; State.staff=null; document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); }
function roleLabel(r){return {super_admin:'Super Admin',manager:'Quản lý',sales:'NV bán hàng',technician:'NV kỹ thuật',viewer:'Chỉ xem'}[r]||r}
function applyPerms(){
  const role=State.staff?.role;
  document.querySelectorAll('.side a[data-perm]').forEach(a=>{
    const p=a.getAttribute('data-perm');
    const ok=(p==='settings'&&['super_admin','manager'].includes(role))||(p==='staff'&&role==='super_admin');
    a.style.display = ok?'block':'none';
  });
}

/* ---------------- Router ---------------- */
function go(view){
  State.view=view;
  document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
  document.getElementById('side').classList.remove('open');
  const el=document.getElementById('view'); el.innerHTML='<p class="muted">Đang tải…</p>';
  ({dashboard:viewDashboard,leads:viewLeads,products:viewProducts,quotations:viewQuotations,colors:viewColors,settings:viewSettings,staff:viewStaff}[view]||viewDashboard)(el).catch(e=>{el.innerHTML='<div class="panel"><p class="err">'+esc(e.message)+'</p></div>'});
}

/* ---------------- Dashboard ---------------- */
async function viewDashboard(el){
  const d = await api('/admin/leads/stats');
  el.innerHTML = `
    <h1>Tổng quan</h1>
    <div class="cards">
      <div class="card"><div class="lbl">Tổng khách hàng</div><div class="num">${d.total??0}</div></div>
      <div class="card"><div class="lbl">Chưa xử lý</div><div class="num">${d.unhandled??0}</div></div>
      <div class="card"><div class="lbl">Đã chốt đơn</div><div class="num">${d.won??0}</div></div>
      <div class="card"><div class="lbl">Tỷ lệ chuyển đổi</div><div class="num">${d.conversionRate??0}%</div></div>
    </div>
    <div class="panel"><h3>Khách theo trạng thái</h3><div class="tblwrap"><table><thead><tr><th>Trạng thái</th><th>Số lượng</th></tr></thead><tbody>
      ${Object.entries(d.byStatus||{}).map(([k,v])=>`<tr><td>${esc(statusLabel(k))}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan=2 class=muted>Chưa có dữ liệu</td></tr>'}
    </tbody></table></div></div>
    <div class="panel"><h3>Sản phẩm được quan tâm</h3><div class="tblwrap"><table><thead><tr><th>Sản phẩm</th><th>Lượt</th></tr></thead><tbody>
      ${(d.topProducts||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.count}</td></tr>`).join('')||'<tr><td colspan=2 class=muted>Chưa có dữ liệu</td></tr>'}
    </tbody></table></div></div>`;
}
function statusLabel(s){return {new:'Mới tiếp nhận',uncontacted:'Chưa liên hệ',contacted:'Đã liên hệ',consulting:'Đang tư vấn',quoted:'Đã gửi báo giá',negotiating:'Đang thương lượng',won:'Đã chốt đơn',lost:'Không thành công',follow_up:'Cần chăm sóc lại'}[s]||s}

/* ---------------- Leads ---------------- */
const LEAD_STATUSES=['new','uncontacted','contacted','consulting','quoted','negotiating','won','lost','follow_up'];
async function viewLeads(el){
  el.innerHTML=`<h1>Khách hàng</h1>
    <div class="panel">
      <div class="row">
        <input id="lf-q" placeholder="Tìm tên / SĐT / nhu cầu" style="min-width:220px">
        <select id="lf-status"><option value="">Mọi trạng thái</option>${LEAD_STATUSES.map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}</select>
        <button class="btn sm" id="lf-go">Lọc</button>
        <button class="btn ghost sm" id="lf-csv">Xuất CSV</button>
        <span class="right muted" id="lf-count"></span>
      </div>
      <div class="tblwrap"><table><thead><tr><th>Mã</th><th>Khách</th><th>SĐT</th><th>Nhu cầu</th><th>Trạng thái</th><th>Ngày</th><th></th></tr></thead><tbody id="lf-rows"></tbody></table></div>
    </div>`;
  document.getElementById('lf-go').onclick=loadLeads;
  document.getElementById('lf-csv').onclick=exportLeadsCsv;
  document.getElementById('lf-q').addEventListener('keydown',e=>{if(e.key==='Enter')loadLeads()});
  await loadLeads();
}
function leadQuery(){const p=new URLSearchParams();const q=document.getElementById('lf-q').value.trim();const s=document.getElementById('lf-status').value;if(q)p.set('q',q);if(s)p.set('status',s);return p.toString()}
async function loadLeads(){
  const r = await api('/admin/leads?'+leadQuery());
  document.getElementById('lf-count').textContent=(r.total??r.items.length)+' khách';
  document.getElementById('lf-rows').innerHTML = r.items.map(l=>`<tr>
    <td>${esc(l.code)}</td><td>${esc(l.name||'–')}</td><td>${esc(l.phone||'–')}</td>
    <td>${esc((l.need||'').slice(0,50))}</td>
    <td><span class="badge ${l.status==='won'?'':'gray'}">${statusLabel(l.status)}</span></td>
    <td class="muted">${fmtDate(l.created_at)}</td>
    <td><button class="btn sm ghost" onclick="openLead('${l.id}')">Chi tiết</button></td>
  </tr>`).join('')||'<tr><td colspan=7 class=muted>Không có khách hàng</td></tr>';
}
async function exportLeadsCsv(){
  try{
    const res = await fetch('/api/admin/leads/export?'+leadQuery(),{headers:{'Authorization':'Bearer '+State.token}});
    if(!res.ok)throw new Error('Không xuất được CSV');
    const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='khach-hang.csv';a.click();URL.revokeObjectURL(url);
  }catch(e){toast(e.message,true)}
}
async function openLead(id){
  const l = await api('/admin/leads/'+id);
  const canWrite=['super_admin','manager','sales'].includes(State.staff.role);
  dlg(`Khách hàng ${esc(l.code)}`, `
    <div class="grid2">
      <div class="fld"><label>Họ tên</label><input value="${esc(l.name||'')}" disabled></div>
      <div class="fld"><label>SĐT</label><input value="${esc(l.phone||'')}" disabled></div>
      <div class="fld"><label>Khu vực</label><input value="${esc(l.area||'')}" disabled></div>
      <div class="fld"><label>Ngân sách</label><input value="${esc(l.budget||'')}" disabled></div>
    </div>
    <div class="fld"><label>Nhu cầu</label><textarea rows=2 disabled>${esc(l.need||'')}</textarea></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
    <div class="grid2">
      <div class="fld"><label>Trạng thái</label><select id="ed-status" ${canWrite?'':'disabled'}>${LEAD_STATUSES.map(s=>`<option value="${s}" ${l.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></div>
      <div class="fld"><label>Mức tiềm năng</label><select id="ed-potential" ${canWrite?'':'disabled'}><option value="">–</option><option value="cold" ${l.potential==='cold'?'selected':''}>Thấp</option><option value="warm" ${l.potential==='warm'?'selected':''}>Trung bình</option><option value="hot" ${l.potential==='hot'?'selected':''}>Cao</option></select></div>
    </div>
    <div class="fld"><label>Ghi chú nội bộ</label><textarea id="ed-note" rows=3 ${canWrite?'':'disabled'}>${esc(l.note||'')}</textarea></div>
  `, canWrite?[{label:'Lưu',cls:'btn',fn:async(close)=>{
    await api('/admin/leads/'+id,{method:'PATCH',body:JSON.stringify({status:document.getElementById('ed-status').value,potential:document.getElementById('ed-potential').value||null,note:document.getElementById('ed-note').value})});
    toast('Đã lưu');close();loadLeads();
  }}]:[]);
}

/* ---------------- Products ---------------- */
async function viewProducts(el){
  const canWrite=['super_admin','manager'].includes(State.staff.role);
  el.innerHTML=`<h1>Sản phẩm</h1>
    <div class="panel">
      <div class="row">
        <input id="pf-q" placeholder="Tìm tên / SKU / thương hiệu" style="min-width:220px">
        <button class="btn sm" id="pf-go">Lọc</button>
        ${canWrite?'<button class="btn sm right" id="pf-new">+ Thêm sản phẩm</button>':''}
      </div>
      <div class="tblwrap"><table><thead><tr><th>SKU</th><th>Tên</th><th>Thương hiệu</th><th>Giá</th><th>Tồn</th><th>TT</th><th></th></tr></thead><tbody id="pf-rows"></tbody></table></div>
    </div>`;
  document.getElementById('pf-go').onclick=loadProducts;
  document.getElementById('pf-q').addEventListener('keydown',e=>{if(e.key==='Enter')loadProducts()});
  if(canWrite)document.getElementById('pf-new').onclick=()=>editProduct(null);
  await loadProducts();
}
async function loadProducts(){
  const q=document.getElementById('pf-q').value.trim();
  const canWrite=['super_admin','manager'].includes(State.staff.role);
  const r = await api('/admin/products?'+(q?('q='+encodeURIComponent(q)):''));
  document.getElementById('pf-rows').innerHTML=(r.items||[]).map(p=>`<tr>
    <td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.brand||'–')}</td>
    <td>${fmtMoney(p.price)}</td><td>${p.stock_quantity??'–'}</td>
    <td><span class="badge ${p.status==='active'?'':'gray'}">${p.status==='active'?'Bán':'Ẩn'}</span></td>
    <td>${canWrite?`<button class="btn sm ghost" onclick='editProduct("${p.id}")'>Sửa</button>`:''}</td>
  </tr>`).join('')||'<tr><td colspan=7 class=muted>Chưa có sản phẩm</td></tr>';
}
async function editProduct(id){
  let p={sku:'',name:'',brand:'',category:'',price:'',stock_quantity:'',coverage_min:'',recommended_coats:'',package_text:'',description:'',status:'active'};
  if(id)p=await api('/admin/products/'+id);
  const f=(k,lbl,type='text')=>`<div class="fld"><label>${lbl}</label><input id="pe-${k}" type="${type}" value="${esc(p[k]??'')}"></div>`;
  dlg(id?'Sửa sản phẩm':'Thêm sản phẩm',`
    <div class="grid2">${f('sku','Mã SKU')}${f('name','Tên sản phẩm')}${f('brand','Thương hiệu')}
    <div class="fld"><label>Danh mục</label><input id="pe-category" value="${esc(p.category||'')}"></div>
    ${f('price','Giá bán (đ)','number')}${f('stock_quantity','Tồn kho','number')}
    ${f('coverage_min','Định mức phủ (m²/lít hoặc /kg)','number')}${f('recommended_coats','Số lớp khuyến nghị','number')}</div>
    ${f('package_text','Quy cách đóng gói (vd: 5L, 18L)')}
    <div class="fld"><label>Mô tả / công dụng</label><textarea id="pe-description" rows=3>${esc(p.description||'')}</textarea></div>
    <div class="fld"><label>Trạng thái</label><select id="pe-status"><option value="active" ${p.status==='active'?'selected':''}>Đang bán</option><option value="inactive" ${p.status==='inactive'?'selected':''}>Ngừng bán</option></select></div>
  `,[{label:id?'Lưu':'Tạo',cls:'btn',fn:async(close)=>{
    const body={sku:val('pe-sku'),name:val('pe-name'),brand:val('pe-brand'),category:val('pe-category'),
      price:numOrNull('pe-price'),stockQuantity:numOrNull('pe-stock_quantity'),coverageMin:numOrNull('pe-coverage_min'),
      recommendedCoats:numOrNull('pe-recommended_coats'),packageText:val('pe-package_text'),description:val('pe-description'),status:val('pe-status')};
    if(!body.sku||!body.name){toast('SKU và Tên là bắt buộc',true);return}
    if(id)await api('/admin/products/'+id,{method:'PATCH',body:JSON.stringify(body)});
    else await api('/admin/products',{method:'POST',body:JSON.stringify(body)});
    toast('Đã lưu');close();loadProducts();
  }}, ...(id&&State.staff.role==='super_admin'?[{label:'Xóa',cls:'btn danger',fn:async(close)=>{if(!confirm('Ẩn sản phẩm này?'))return;await api('/admin/products/'+id,{method:'DELETE'});toast('Đã ẩn');close();loadProducts();}}]:[])]);
}
function val(id){return document.getElementById(id).value.trim()}
function numOrNull(id){const v=document.getElementById(id).value.trim();return v===''?null:Number(v)}

/* ---------------- Quotations ---------------- */
async function viewQuotations(el){
  el.innerHTML=`<h1>Báo giá</h1><div class="panel"><div class="tblwrap"><table><thead><tr><th>Mã</th><th>Khách</th><th>Tổng</th><th>Trạng thái</th><th>Ngày</th><th></th></tr></thead><tbody id="q-rows"></tbody></table></div></div>`;
  const r=await api('/admin/quotations');
  document.getElementById('q-rows').innerHTML=(r.items||[]).map(q=>`<tr>
    <td>${esc(q.code)}</td><td>${esc(q.customer_name||'–')}</td><td>${fmtMoney(q.total)}</td>
    <td><span class="badge gray">${qStatus(q.status)}</span></td><td class="muted">${fmtDate(q.created_at)}</td>
    <td><a class="btn sm ghost" href="/api/admin/quotations/${q.id}/print?token=${encodeURIComponent(State.token)}" target="_blank">In PDF</a></td>
  </tr>`).join('')||'<tr><td colspan=6 class=muted>Chưa có báo giá</td></tr>';
}
function qStatus(s){return {draft:'Nháp',sent:'Đã gửi',accepted:'Đã duyệt',rejected:'Từ chối',expired:'Hết hạn'}[s]||s}

/* ---------------- Colors ---------------- */
async function viewColors(el){
  el.innerHTML=`<h1>Bảng màu</h1><div class="panel"><div class="row"><input id="c-q" placeholder="Tìm mã / tên màu"><button class="btn sm" id="c-go">Tìm</button></div><div class="tblwrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Màu</th><th>Bộ sưu tập</th></tr></thead><tbody id="c-rows"></tbody></table></div></div>`;
  const load=async()=>{const q=document.getElementById('c-q').value.trim();if(!q){document.getElementById('c-rows').innerHTML='<tr><td colspan=4 class=muted>Nhập mã hoặc tên màu để tìm</td></tr>';return;}const r=await api('/colors/search?q='+encodeURIComponent(q));
    document.getElementById('c-rows').innerHTML=(r.colors||[]).map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.name||'–')}</td><td><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #ccc;background:${esc(c.hex||'#fff')}"></span> ${esc(c.hex||'')}</td><td>${esc(c.collection||'–')}</td></tr>`).join('')||'<tr><td colspan=4 class=muted>Không có màu</td></tr>';};
  document.getElementById('c-go').onclick=load;await load();
}

/* ---------------- Settings ---------------- */
async function viewSettings(el){
  const r=await api('/admin/settings');
  const canWrite=State.staff.role==='super_admin';
  const fields=[['company_name','Tên doanh nghiệp'],['company_hotline','Hotline'],['company_email','Email'],['company_website','Website'],['company_address','Địa chỉ'],['working_hours','Giờ làm việc'],['service_area','Khu vực phục vụ'],['greeting','Lời chào chatbot']];
  const map={};(r.items||[]).forEach(i=>map[i.key]=i.value);
  el.innerHTML=`<h1>Cấu hình</h1><div class="panel"><p class="muted">Thông tin doanh nghiệp dùng chung cho chatbot và báo giá. Không cần sửa mã nguồn.</p>
    ${fields.map(([k,l])=>`<div class="fld"><label>${l}</label>${k==='greeting'?`<textarea id="s-${k}" rows=3 ${canWrite?'':'disabled'}>${esc(map[k]||'')}</textarea>`:`<input id="s-${k}" value="${esc(map[k]||'')}" ${canWrite?'':'disabled'}>`}</div>`).join('')}
    ${canWrite?'<button class="btn" id="s-save">Lưu cấu hình</button>':'<p class="muted">Chỉ Super Admin được sửa cấu hình.</p>'}
  </div>`;
  if(canWrite)document.getElementById('s-save').onclick=async()=>{
    const items=fields.map(([k])=>({key:k,value:document.getElementById('s-'+k).value}));
    await api('/admin/settings',{method:'PUT',body:JSON.stringify({items})});toast('Đã lưu cấu hình');
  };
}

/* ---------------- Staff ---------------- */
async function viewStaff(el){
  const r=await api('/auth/staff');
  el.innerHTML=`<h1>Nhân viên</h1><div class="panel"><div class="row"><button class="btn sm right" id="st-new">+ Thêm nhân viên</button></div>
    <div class="tblwrap"><table><thead><tr><th>Email</th><th>Tên</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody id="st-rows"></tbody></table></div></div>`;
  document.getElementById('st-rows').innerHTML=(r.items||r||[]).map(s=>`<tr>
    <td>${esc(s.email)}</td><td>${esc(s.full_name)}</td><td>${roleLabel(s.role)}</td>
    <td><span class="badge ${s.is_active?'':'gray'}">${s.is_active?'Hoạt động':'Đã khóa'}</span></td>
    <td><button class="btn sm ghost" onclick='toggleStaff("${s.id}",${s.is_active?'false':'true'})'>${s.is_active?'Khóa':'Mở'}</button></td>
  </tr>`).join('')||'<tr><td colspan=5 class=muted>Chưa có nhân viên</td></tr>';
  document.getElementById('st-new').onclick=newStaff;
}
async function toggleStaff(id,active){try{await api('/auth/staff/'+id+'/active',{method:'POST',body:JSON.stringify({isActive:active==='true'||active===true})});toast('Đã cập nhật');go('staff');}catch(e){toast(e.message,true)}}
function newStaff(){
  dlg('Thêm nhân viên',`
    <div class="fld"><label>Email</label><input id="ns-email" type="email"></div>
    <div class="fld"><label>Họ tên</label><input id="ns-name"></div>
    <div class="fld"><label>Mật khẩu tạm</label><input id="ns-pass" type="text" placeholder="ít nhất 8 ký tự"></div>
    <div class="fld"><label>Vai trò</label><select id="ns-role"><option value="sales">NV bán hàng</option><option value="technician">NV kỹ thuật</option><option value="manager">Quản lý</option><option value="viewer">Chỉ xem</option><option value="super_admin">Super Admin</option></select></div>
  `,[{label:'Tạo',cls:'btn',fn:async(close)=>{
    await api('/auth/staff',{method:'POST',body:JSON.stringify({email:val('ns-email'),fullName:val('ns-name'),password:val('ns-pass'),role:val('ns-role')})});
    toast('Đã tạo nhân viên');close();go('staff');
  }}]);
}

/* ---------------- Dialog helper ---------------- */
function dlg(title, bodyHtml, actions=[]){
  const old=document.getElementById('dlg');if(old)old.remove();
  const d=document.createElement('dialog');d.id='dlg';
  d.innerHTML=`<div class="dlg-h"><h3>${esc(title)}</h3><button class="btn ghost sm" id="dlg-x">✕</button></div><div class="dlg-b">${bodyHtml}</div><div class="dlg-h" style="border-top:1px solid var(--line);border-bottom:none;justify-content:flex-end;gap:8px" id="dlg-actions"></div>`;
  document.body.appendChild(d);
  const close=()=>{d.close();d.remove()};
  document.getElementById('dlg-x').onclick=close;
  const act=d.querySelector('#dlg-actions');
  actions.forEach(a=>{const b=document.createElement('button');b.className=a.cls||'btn';b.textContent=a.label;b.onclick=async()=>{try{await a.fn(close)}catch(e){toast(e.message,true)}};act.appendChild(b)});
  const cb=document.createElement('button');cb.className='btn ghost';cb.textContent='Đóng';cb.onclick=close;act.appendChild(cb);
  d.showModal();
}

/* ---------------- Wire up ---------------- */
document.getElementById('li-btn').onclick=doLogin;
document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('logout').onclick=logout;
document.getElementById('menuBtn').onclick=()=>document.getElementById('side').classList.toggle('open');
document.querySelectorAll('.side a[data-view]').forEach(a=>a.onclick=()=>go(a.dataset.view));
</script>
